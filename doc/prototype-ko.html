<title>COVID-19 scRNA-seq Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: lab-bench pipeline — step rail on the left (top chips on phones), one instrument panel per step */
:root{
  --bg:#eef2f1; --surface:#ffffff; --surface-2:#f6f8f8; --ink:#13201f; --ink-2:#45524f; --muted:#76837f; --line:#d9e1df;
  --accent:#0d6b70; --accent-ink:#ffffff; --accent-soft:#d9eeee;
  --healthy:#7b8a8f; --covid:#b0215a;
  --up:#d9531e; --down:#2a78d6;
  --good:#1f7a3a; --warn:#a15c00;
  --seq0:#e3e8ea; --seq1:#184f95;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c7:#6250d6; --c8:#e34948;
  --sans:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1514; --surface:#162120; --surface-2:#1b2827; --ink:#e5eeec; --ink-2:#aab9b6; --muted:#7f8f8c; --line:#283634;
  --accent:#53bcc2; --accent-ink:#04201f; --accent-soft:#173c3d;
  --healthy:#97a7ab; --covid:#e45b8f; --up:#e8763f; --down:#4b93ea; --good:#5cc47a; --warn:#e0a040;
  --seq0:#283433; --seq1:#9ec5f4;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e1514; --surface:#162120; --surface-2:#1b2827; --ink:#e5eeec; --ink-2:#aab9b6; --muted:#7f8f8c; --line:#283634;
  --accent:#53bcc2; --accent-ink:#04201f; --accent-soft:#173c3d;
  --healthy:#97a7ab; --covid:#e45b8f; --up:#e8763f; --down:#4b93ea; --good:#5cc47a; --warn:#e0a040;
  --seq0:#283433; --seq1:#9ec5f4;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767;
  color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); padding-block:20px 40px}
.app{max-width:1180px; margin:0 auto; display:grid; grid-template-columns:220px minmax(0,1fr); gap:28px; align-items:start}
button{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* rail */
.rail{position:sticky; top:20px}
.brand{font-family:var(--mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:6px}
.brand b{display:block; font-family:var(--sans); font-size:19px; letter-spacing:0; text-transform:none; color:var(--ink); line-height:1.25; margin-top:2px}
.rail ol{list-style:none; margin:16px 0 0; padding:0; display:flex; flex-direction:column; gap:2px; position:relative}
.rail ol::before{content:""; position:absolute; left:13px; top:8px; bottom:8px; width:2px; background:var(--line)}
.rail li button{all:unset; cursor:pointer; display:flex; gap:10px; align-items:center; padding:5px 8px 5px 0; width:100%; border-radius:8px; position:relative}
.rail li button:focus-visible{outline:2px solid var(--accent)}
.dot{width:28px; height:28px; flex:none; border-radius:50%; display:grid; place-items:center; font-family:var(--mono); font-size:11px; font-weight:600;
  background:var(--surface); border:2px solid var(--line); color:var(--muted); z-index:1}
.rail .nm{font-size:13.5px; color:var(--ink-2); line-height:1.2}
.rail .nm small{display:block; font-family:var(--mono); font-size:10.5px; color:var(--muted)}
.rail li.done .dot{border-color:var(--accent); color:var(--accent)}
.rail li.cur .dot{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.rail li.cur .nm{color:var(--ink); font-weight:600}
.lang{margin-top:18px; display:flex; gap:6px; align-items:center; font-size:12px; color:var(--muted)}

/* segmented & buttons */
.seg{display:inline-flex; background:var(--surface-2); border:1px solid var(--line); border-radius:999px; padding:3px; gap:2px}
.seg button{border:0; background:none; padding:5px 12px; border-radius:999px; cursor:pointer; font-size:13px; color:var(--ink-2); font-family:var(--mono)}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
.btn{border:0; background:var(--accent); color:var(--accent-ink); padding:9px 16px; border-radius:10px; font-weight:600; cursor:pointer; font-size:14px; display:inline-flex; gap:8px; align-items:center}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:var(--surface); color:var(--ink); border:1px solid var(--line)}
.btn[disabled]{opacity:.45; cursor:default}
.btn .k{font-family:var(--mono); font-weight:500; font-size:12px; opacity:.85}

/* stage */
.head{display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap; margin-bottom:14px}
.eyebrow{font-family:var(--mono); font-size:12px; color:var(--accent); letter-spacing:.06em; text-transform:uppercase}
h1{font-size:clamp(24px,3.4vw,32px); line-height:1.15; margin:2px 0 0; text-wrap:balance; font-weight:700}
h1 span{font-family:var(--mono); font-weight:500; font-size:.55em; color:var(--muted); margin-left:8px}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:18px; display:flex; flex-direction:column; gap:16px}
.controls{display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center}
.ctl{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-2); font-family:var(--mono)}
.ctl input[type=range]{accent-color:var(--accent); width:150px}
.ctl output{min-width:44px; color:var(--ink); font-weight:600}
.grid2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px}
.fig{min-width:0}
.fig .cap{font-family:var(--mono); font-size:11.5px; color:var(--muted); margin-bottom:6px; display:flex; justify-content:space-between; gap:8px}
canvas.plot{width:100%; aspect-ratio:4/3; display:block; background:var(--surface-2); border-radius:10px; touch-action:none}
canvas.plot.sq{aspect-ratio:1/1}
.svgbox{width:100%; min-width:0}
.svgbox svg{display:block; width:100%; height:auto; overflow:visible}
svg text{font-family:var(--mono); fill:var(--ink-2); font-size:11px}
svg .ax{stroke:var(--line)} svg .lbl{fill:var(--muted)} svg .strong{fill:var(--ink); font-weight:600}

/* DO / SEE / NEXT */
.story{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px}
.card{border:1px solid var(--line); border-radius:12px; padding:10px 12px; background:var(--surface-2); min-width:0}
.card .tag{font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:.08em; display:inline-block; padding:1px 7px; border-radius:5px; margin-bottom:4px}
.card.do .tag{background:var(--line); color:var(--ink-2)}
.card.see .tag{background:var(--accent-soft); color:var(--accent)}
.card.next .tag{background:var(--accent); color:var(--accent-ink)}
.card p{margin:0; font-size:14px}
.card.locked p{color:var(--muted)}
.code{display:flex; align-items:center; gap:8px; background:var(--surface-2); border:1px dashed var(--line); border-radius:10px; padding:7px 10px; min-width:0}
.code code{font-family:var(--mono); font-size:12.5px; color:var(--ink); overflow-x:auto; white-space:nowrap; flex:1; min-width:0}
.code .who{font-family:var(--mono); font-size:10.5px; color:var(--muted); text-transform:uppercase; flex:none}
.code button{border:1px solid var(--line); background:var(--surface); border-radius:6px; font-size:11px; padding:2px 8px; cursor:pointer; font-family:var(--mono); flex:none}

.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{font-family:var(--mono); font-size:12px; border:1px solid var(--line); border-radius:999px; padding:3px 10px; background:var(--surface); color:var(--ink-2); display:inline-flex; align-items:center; gap:6px}
.chip.ok{color:var(--good); border-color:currentColor} .chip.bad{color:var(--warn); border-color:currentColor}
.chip i{width:9px; height:9px; border-radius:50%; display:inline-block; font-style:normal}
button.chip{cursor:pointer}
button.chip[aria-pressed="false"]{opacity:.45}

.tiles{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px}
.tile{border:1px solid var(--line); border-radius:12px; padding:10px 12px}
.tile b{display:block; font-family:var(--mono); font-size:22px; font-variant-numeric:tabular-nums; line-height:1.2}
.tile span{font-size:12px; color:var(--muted)}

.qbox{border-left:3px solid var(--accent); padding:4px 0 4px 14px}
.qbox .q{font-size:clamp(17px,2.4vw,21px); font-weight:600; text-wrap:balance; line-height:1.35}
.meta{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}

.mtx{overflow-x:auto} .mtx table{border-collapse:separate; border-spacing:2px; font-family:var(--mono); font-size:11.5px; font-variant-numeric:tabular-nums}
.mtx th{font-weight:500; color:var(--muted); padding:2px 6px; text-align:right; white-space:nowrap}
.mtx td{width:34px; height:26px; text-align:center; border-radius:4px}

.tt{border:0; background:none; padding:0; border-bottom:1.5px dotted var(--accent); cursor:help; font:inherit; color:inherit}
.pop{position:fixed; z-index:30; max-width:260px; background:var(--ink); color:var(--bg); padding:8px 11px; border-radius:9px; font-size:13px; line-height:1.4; box-shadow:0 6px 20px rgb(0 0 0 / .18)}
.pop b{font-family:var(--mono); display:block; font-size:12px; margin-bottom:2px}
.tip{position:fixed; z-index:31; pointer-events:none; background:var(--ink); color:var(--bg); font-family:var(--mono); font-size:12px; padding:5px 8px; border-radius:7px; white-space:nowrap}

.quiz{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px}
.quiz label{display:flex; flex-direction:column; gap:3px; font-family:var(--mono); font-size:11.5px; color:var(--muted); min-width:0}
.quiz select{font:inherit; font-family:var(--sans); font-size:13px; padding:5px 6px; border-radius:8px; border:1px solid var(--line); background:var(--surface); color:var(--ink); width:100%}
.quiz select.right{border-color:var(--good); box-shadow:0 0 0 1px var(--good)}
.quiz select.wrong{border-color:var(--warn); box-shadow:0 0 0 1px var(--warn)}
.legend{display:flex; flex-wrap:wrap; gap:6px}

.finds{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px}
.find{border:1px solid var(--line); border-radius:14px; padding:14px; display:flex; flex-direction:column; gap:8px; min-width:0}
.find .n{font-family:var(--mono); font-size:11px; color:var(--accent)}
.find h3{margin:0; font-size:16px; line-height:1.3; text-wrap:balance}
.find p{margin:0; font-size:13.5px; color:var(--ink-2)}
.recap{display:flex; flex-wrap:wrap; gap:4px; align-items:center; font-family:var(--mono); font-size:12px}
.recap span{padding:3px 8px; border-radius:6px; background:var(--accent-soft); color:var(--accent)}
.recap em{font-style:normal; color:var(--muted)}
.ref{font-size:13px; color:var(--ink-2)} .ref a{color:var(--accent)}
.note{font-size:12.5px; color:var(--muted)}

.pager{display:flex; justify-content:space-between; gap:10px; margin-top:16px}
.pager .btn.ghost{min-width:96px}
.pulse{animation:pulse 1.6s ease-out 2}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--accent)}100%{box-shadow:0 0 0 10px transparent}}
@media (prefers-reduced-motion: reduce){ .pulse{animation:none} }

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr); gap:14px}
  .rail{position:static}
  .rail ol{flex-direction:row; overflow-x:auto; gap:4px; padding-bottom:4px; margin-top:10px}
  .rail ol::before{display:none}
  .rail li button{padding:4px 8px 4px 4px; border:1px solid var(--line); border-radius:999px; background:var(--surface); width:auto}
  .rail .nm{white-space:nowrap; font-size:12.5px} .rail .nm small{display:none}
  .dot{width:22px; height:22px; font-size:10px}
  .lang{margin-top:8px}
}
@media (max-width:640px){
  .grid2,.story,.finds{grid-template-columns:minmax(0,1fr)}
  .quiz{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tiles{grid-template-columns:repeat(3,minmax(0,1fr))} .tile b{font-size:18px}
  .panel{padding:14px}
}
</style>

<div class="app">
  <aside class="rail">
    <div class="brand">Single-cell Lab<b>COVID-19 혈액 면역세포 분석</b></div>
    <ol id="rail"></ol>
    <div class="lang">Code <div class="seg" id="langSeg"><button data-l="seurat">Seurat</button><button data-l="scanpy">Scanpy</button></div></div>
  </aside>
  <main>
    <div id="stage"></div>
    <nav class="pager"><button class="btn ghost" id="prev">← 이전</button><button class="btn" id="next">다음 →</button></nav>
  </main>
</div>
<div id="tip" class="tip" hidden></div>
<div id="pop" class="pop" hidden></div>

<script>
/* ---------- seeded data ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=mulberry32(20200715);
const gauss=()=>{let u=0,v=0;while(!u)u=R();while(!v)v=R();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const hash=(n)=>{n=Math.imul(n^0x9e3779b9,0x85ebca6b);n^=n>>>13;n=Math.imul(n,0xc2b2ae35);n^=n>>>16;return(n>>>0)/4294967296};

const TYPES=[
 {k:'T',    name:'T cell',          col:'--c1', c:[-3.5,2.5], sd:[1.3,.9],  H:42, C:37},
 {k:'NK',   name:'NK cell',         col:'--c4', c:[-0.5,5.8], sd:[.7,.6],   H:12, C:5},
 {k:'B',    name:'B cell',          col:'--c3', c:[4.2,4.6],  sd:[.8,.7],   H:10, C:9},
 {k:'PB',   name:'Plasmablast',     col:'--c6', c:[6.8,2.0],  sd:[.45,.45], H:1,  C:7},
 {k:'M14',  name:'CD14 Mono',       col:'--c2', c:[3.2,-2.6], sd:[1.0,.85], H:22, C:26},
 {k:'M16',  name:'CD16 Mono',       col:'--c5', c:[6.4,-4.6], sd:[.55,.5],  H:8,  C:2},
 {k:'pDC',  name:'pDC',             col:'--c7', c:[-5.2,-3.8],sd:[.4,.4],   H:3,  C:.8},
 {k:'Neut', name:'Dev. Neutrophil', col:'--c8', c:[-0.4,-5.6],sd:[.8,.55],  H:.6, C:13},
];
const SH={T:'T',NK:'NK',B:'B',PB:'PB',M14:'Mono14',M16:'Mono16',pDC:'pDC',Neut:'Neut'};
const SH2={T:['T cell'],NK:['NK'],B:['B cell'],PB:['Plasma','blast'],M14:['CD14','Mono'],M16:['CD16','Mono'],pDC:['pDC'],Neut:['Dev.','Neut']};
const TI=Object.fromEntries(TYPES.map((t,i)=>[t.k,i]));
const cells=[]; // good cells
const qc=[];    // all cells incl. bad, for QC plot
['H','C'].forEach(cond=>{
  TYPES.forEach((t,ti)=>{
    const n=Math.round(t[cond]/100*500);
    for(let j=0;j<n;j++){
      const gx=gauss(),gy=gauss();
      const ux=t.c[0]+gx*t.sd[0], uy=t.c[1]+gy*t.sd[1];
      const c={cond,t:ti,ux,uy,
        px:t.c[0]*.55+gauss()*1.25, py:t.c[1]*.45+gauss()*1.25,
        bx:gauss(), by:gauss(), id:cells.length};
      cells.push(c);
      qc.push({kind:'good', g:clamp(2100+gauss()*480,700,3900), m:clamp(Math.abs(4+gauss()*1.6),.4,9.5)});
    }
  });
  for(let j=0;j<35;j++) qc.push({kind:'dead', g:250+R()*1050, m:12+R()*23});
  for(let j=0;j<10;j++) qc.push({kind:'dbl',  g:4200+R()*2300, m:2+R()*4});
});

/* expression model: [mean(log), pct] */
const EX={
  CD3E:{T:[2.5,.9],NK:[.3,.12]},
  NKG7:{NK:[3,.95],T:[.9,.3]},
  MS4A1:{B:[2.5,.85],PB:[.5,.2]},
  JCHAIN:{PB:[3,.95],B:[.3,.08]},
  CD14:{M14:[2.8,.9],M16:[.6,.25],Neut:[.5,.2]},
  FCGR3A:{M16:[2.8,.9],NK:[1.8,.7],M14:[.3,.12]},
  LILRA4:{pDC:[2.8,.9]},
  LTF:{Neut:[3,.9]},
  ACTB:{_:[2.0,.92]}, 'MT-CO1':{_:[1.2,.7]}, LYZ:{M14:[3,.95],M16:[2.2,.8],Neut:[1.2,.5],pDC:[.4,.2]}
};
const MARKERS=['CD3E','NKG7','MS4A1','JCHAIN','CD14','FCGR3A','LILRA4','LTF'];
const ex=(gene,tk)=>{const g=EX[gene]; return g[tk]||g._||[.05,.03]};
const cellExpr=(c,gi,gene)=>{const [m,p]=ex(gene,TYPES[c.t].k); return hash(c.id*97+gi*7919)<p ? m*(.55+.9*hash(c.id*31+gi*131+7)) : 0};

/* ---------- state ---------- */
const S={step:0,done:new Set(),mito:10,maxG:4000,norm:false,nHVG:20,nPC:10,umapRun:false,res:null,gene:'CD3E',ans:{},annot:false,compView:'pct',hiType:null,de:false,deGroup:null,lang:'seurat',loaded:false};
try{const l=localStorage.getItem('sclab-lang'); if(l) S.lang=l}catch(e){}

/* ---------- colors ---------- */
let COL={};
const KEYS=['--bg','--surface','--surface-2','--ink','--ink-2','--muted','--line','--accent','--accent-soft','--healthy','--covid','--up','--down','--seq0','--seq1','--c1','--c2','--c3','--c4','--c5','--c6','--c7','--c8'];
function refreshColors(){const cs=getComputedStyle(document.documentElement);KEYS.forEach(k=>COL[k]=cs.getPropertyValue(k).trim())}
const hex2rgb=h=>{h=h.replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');const n=parseInt(h,16);return[n>>16&255,n>>8&255,n&255]};
const mix=(a,b,t)=>{const A=hex2rgb(a),B=hex2rgb(b);return`rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')})`};
const seq=t=>mix(COL['--seq0'],COL['--seq1'],clamp(t,0,1));

/* ---------- clusters ---------- */
const CL={};
function clusters(res){
  if(CL[res]) return CL[res];
  // groups of (type, sub) -> cluster
  const keyOf=c=>{
    const k=TYPES[c.t].k;
    if(res===0.1){ if(k==='T'||k==='NK') return 'T'; if(k==='M14'||k==='M16') return 'M14'; if(k==='B'||k==='PB') return 'B'; return k; }
    if(res===1.5){ const t=TYPES[c.t];
      if(k==='T') return 'T#'+(c.ux<t.c[0]-.5?0:c.ux>t.c[0]+.5?2:1);
      if(k==='M14') return 'M14#'+(c.uy>t.c[1]?0:1);
      if(k==='B') return 'B#'+(c.ux>t.c[0]?0:1);
    }
    return k;
  };
  const cnt={}; cells.forEach(c=>{const k=keyOf(c);cnt[k]=(cnt[k]||0)+1});
  const order=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]);
  const id=Object.fromEntries(order.map((k,i)=>[k,i]));
  const lab=cells.map(c=>id[keyOf(c)]);
  const info=order.map(k=>{const [base,sb]=k.split('#'); const sub=sb?+sb:0; return {k,base,sub,col:TYPES[TI[base]].col}});
  return CL[res]={lab,info,n:order.length};
}
const MID=()=>clusters(0.5);

/* ---------- tooltip / popover ---------- */
const tip=document.getElementById('tip'), pop=document.getElementById('pop');
function showTip(x,y,html){tip.innerHTML=html;tip.hidden=false;const w=tip.offsetWidth;tip.style.left=Math.min(x+14,innerWidth-w-8)+'px';tip.style.top=(y-34)+'px'}
const hideTip=()=>tip.hidden=true;
document.addEventListener('pointermove',e=>{const t=e.target.closest&&e.target.closest('[data-tip]'); if(t) showTip(e.clientX,e.clientY,t.dataset.tip); else if(!e.target.closest('canvas')) hideTip()});

const GL={
 'PBMC':'혈액에서 뽑은 면역세포 (T, B, NK, monocyte…)',
 'scRNA-seq':'세포 하나하나의 RNA를 따로 읽는 기술',
 'count matrix':'행 = gene, 열 = cell, 칸 = RNA 개수 (UMI)',

/* ---------- canvas scatter ---------- */
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function scatter(cv,cfg){
  const W=cv.clientWidth,H=cv.clientHeight; if(!W) return;
  const dpr=devicePixelRatio||1; cv.width=W*dpr; cv.height=H*dpr;
  const g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,H);
  const pad=cfg.ticks?{l:46,r:12,t:12,b:38}:{l:22,r:10,t:10,b:22};
  const [x0,x1]=cfg.xd,[y0,y1]=cfg.yd;
  const X=v=>pad.l+(v-x0)/(x1-x0)*(W-pad.l-pad.r), Y=v=>H-pad.b-(v-y0)/(y1-y0)*(H-pad.t-pad.b);
  g.font='11px "IBM Plex Mono", monospace'; g.lineWidth=1;
  if(cfg.ticks){
    g.strokeStyle=COL['--line']; g.fillStyle=COL['--muted'];
    cfg.xt.forEach(v=>{g.beginPath();g.moveTo(X(v),pad.t);g.lineTo(X(v),H-pad.b);g.stroke();g.textAlign='center';g.fillText(cfg.xf?cfg.xf(v):v,X(v),H-pad.b+14)});
    cfg.yt.forEach(v=>{g.beginPath();g.moveTo(pad.l,Y(v));g.lineTo(W-pad.r,Y(v));g.stroke();g.textAlign='right';g.fillText(v,pad.l-6,Y(v)+4)});
  }
  g.fillStyle=COL['--muted']; g.textAlign='center';
  g.fillText(cfg.xl||'',pad.l+(W-pad.l-pad.r)/2,H-6);
  g.save(); g.translate(11,pad.t+(H-pad.t-pad.b)/2); g.rotate(-Math.PI/2); g.fillText(cfg.yl||'',0,0); g.restore();
  (cfg.zones||[]).forEach(z=>{g.fillStyle=z.c;g.globalAlpha=.08;g.fillRect(X(z.x0),Y(z.y1),X(z.x1)-X(z.x0),Y(z.y0)-Y(z.y1));g.globalAlpha=1});
  (cfg.pts||[]).forEach(p=>{g.globalAlpha=p.a??.8;g.fillStyle=p.c;g.beginPath();g.arc(X(p.x),Y(p.y),p.r||2.5,0,6.2832);g.fill()});
  g.globalAlpha=1;
  (cfg.lines||[]).forEach(l=>{g.strokeStyle=l.c;g.lineWidth=2;g.setLineDash([5,4]);g.beginPath();
    if(l.x!=null){g.moveTo(X(l.x),pad.t);g.lineTo(X(l.x),H-pad.b)}else{g.moveTo(pad.l,Y(l.y));g.lineTo(W-pad.r,Y(l.y))}
    g.stroke();g.setLineDash([]);g.lineWidth=1;
    if(l.t){g.fillStyle=l.c;g.textAlign=l.x!=null?'left':'right';g.font='600 11px "IBM Plex Mono", monospace';
      if(l.x!=null)g.fillText(l.t,X(l.x)+4,pad.t+12);else g.fillText(l.t,W-pad.r-4,Y(l.y)-5)}
    g.font='11px "IBM Plex Mono", monospace'});
  (cfg.labels||[]).forEach(L=>{
    g.font=`600 ${L.s||11}px "IBM Plex Sans KR", sans-serif`; const tw=g.measureText(L.t).width, x=X(L.x), y=Y(L.y);
    g.fillStyle=COL['--surface']; g.globalAlpha=.88; g.beginPath(); g.roundRect?g.roundRect(x-tw/2-5,y-9,tw+10,18,9):g.rect(x-tw/2-5,y-9,tw+10,18); g.fill(); g.globalAlpha=1;
    g.fillStyle=COL['--ink']; g.textAlign='center'; g.fillText(L.t,x,y+4);
  });
  cv._hit={pts:cfg.pts||[],X,Y};
}
function hoverable(cv){
  cv.addEventListener('pointermove',e=>{
    const h=cv._hit; if(!h) return; const r=cv.getBoundingClientRect(); const mx=e.clientX-r.left,my=e.clientY-r.top;
    let best=null,bd=144; for(const p of h.pts){ if(!p.tip) continue; const dx=h.X(p.x)-mx,dy=h.Y(p.y)-my,d=dx*dx+dy*dy; if(d<bd){bd=d;best=p} }
    best?showTip(e.clientX,e.clientY,best.tip):hideTip();
  });
  cv.addEventListener('pointerleave',hideTip);
}

 build(el){

   <div class="controls"><span class="chip"><i style="background:var(--c2)"></i>CD14 Mono 안에서</span><span class="chip">COVID vs Healthy</span><button class="btn" id="deBtn" ${S.de?'hidden':''}>FindMarkers</button>
    <div class="seg" id="gSeg" ${S.de?'':'hidden'}><button data-g="">전체</button><button data-g="mhc">HLA class II</button><button data-g="isg">ISG</button><button data-g="cyt">Cytokine</button></div></div>
   <div class="fig"><div class="cap"><span>${T('log2FC')}</span><span id="gMsg"></span></div><div class="svgbox" id="de"></div></div>
   <div class="chips"><span class="chip"><i style="background:var(--up)"></i>COVID에서 ↑</span><span class="chip"><i style="background:var(--down)"></i>COVID에서 ↓</span><span class="chip"><i style="background:var(--line)"></i>ns (차이 없음)</span></div>
   ${story(`같은 세포 종류 안에서 두 그룹의 유전자 비교 (${T('DE')})`,`${T('HLA class II')} ↓ · ${T('ISG')} ↑ · TNF / IL6 / IL1B는 거의 그대로.`,'결론 정리 → <b>Conclusion</b>',S.done.has(9))}`;
  el.querySelector('#deBtn').onclick=()=>{S.de=true;S.done.add(9);this.build(el);this.draw();markRail()};
  el.querySelectorAll('#gSeg button').forEach(b=>b.onclick=()=>{S.deGroup=b.dataset.g||null;this.draw()});
 },
 draw(){
  document.querySelectorAll('#gSeg button').forEach(b=>b.setAttribute('aria-pressed',(b.dataset.g||null)===S.deGroup));
  document.getElementById('gMsg').textContent=S.deGroup?GRP[S.deGroup][1]:'';
  const box=document.getElementById('de'),W=boxW(box),rh=24,t=10,l=78,H=t+DEG.length*rh+30,X=v=>l+(v+2)/5*(W-l-30);
  let s=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
  [-2,-1,0,1,2,3].forEach(v=>s+=`<line class="ax" x1="${X(v)}" x2="${X(v)}" y1="${t}" y2="${H-24}" ${v===0?'style="stroke:var(--muted)"':''}/><text x="${X(v)}" y="${H-8}" text-anchor="middle" class="lbl">${v>0?'+':''}${v}</text>`);
  DEG.forEach((d,i)=>{const y=t+i*rh,show=S.de,dim=S.deGroup&&S.deGroup!==d.grp?' opacity=".25"':'';
    const v=show?d.fc:0,x0=X(Math.min(v,0)),w=Math.abs(X(v)-X(0));
    s+=`<g${dim}><text x="${l-8}" y="${y+rh/2+4}" text-anchor="end" class="${S.deGroup===d.grp?'strong':''}">${d.g}</text>`+
      `<rect data-tip="${d.g} · log2FC ${d.fc>0?'+':''}${d.fc}${d.ns?' · ns':' · p<0.05'}" x="${x0}" y="${y+4}" width="${Math.max(w,2)}" height="${rh-8}" rx="3" fill="${d.ns?'var(--line)':d.fc>0?'var(--up)':'var(--down)'}"/>`+
      (show&&d.ns?`<text x="${X(Math.max(d.fc,0))+6}" y="${y+rh/2+4}" class="lbl">ns</text>`:'')+'</g>';
    if(i===3||i===7) s+=`<line x1="0" x2="${W}" y1="${y+rh}" y2="${y+rh}" style="stroke:var(--line);stroke-dasharray:3 3"/>`});
  box.innerHTML=s+'</svg>';
 }});

/* 10. CONCLUSION */
STEPS.push({k:'Result',ko:'결론',title:'Conclusion',
 build(el){
  const pH=prop('H'),pC=prop('C');
  const mini=(a,b,max,fmt)=>`<svg width="100%" height="64" viewBox="0 0 200 64" preserveAspectRatio="xMinYMid meet"><rect x="0" y="8" width="${Math.max(a/max*150,2)}" height="16" rx="3" fill="var(--healthy)"/><text x="${Math.max(a/max*150,2)+6}" y="21">${fmt(a)}</text><rect x="0" y="36" width="${Math.max(b/max*150,2)}" height="16" rx="3" fill="var(--covid)"/><text x="${Math.max(b/max*150,2)+6}" y="49">${fmt(b)}</text></svg>`;
  el.innerHTML=`
   <div class="qbox"><div class="q">COVID-19 중증 환자의 혈액은 세포 구성과 유전자 상태가 둘 다 달랐다.</div><div class="meta"><span class="chip"><i style="background:var(--healthy)"></i>Healthy</span><span class="chip"><i style="background:var(--covid)"></i>COVID-19</span></div></div>
   <div class="finds">
    <div class="find"><span class="n">FINDING 1 · Composition</span><h3>새로운 세포가 혈액에 등장</h3>${mini(pH[7],pC[7],.14,pct)}<p>${T('Dev. Neutrophil')} ↑ (특히 ${T('ARDS')} 환자). ${T('Plasmablast')} ↑, NK · pDC ↓.</p></div>
    <div class="find"><span class="n">FINDING 2 · DE</span><h3>Monocyte의 HLA class II ↓</h3>${mini(3.0,1.2,3.4,v=>'HLA-DRA '+v.toFixed(1))}<p>항원제시 능력 약화. 대신 ${T('ISG')} ↑.</p></div>
    <div class="find"><span class="n">FINDING 3 · DE</span><h3>“Cytokine storm” 신호는 약했다</h3>${mini(.3,.32,3.4,v=>'TNF '+v.toFixed(2))}<p>혈액 세포에선 TNF · IL6 · IL1B가 거의 그대로 → 염증 신호의 출처는 다른 곳일 수도.</p></div>
   </div>
   <div class="fig"><div class="cap"><span>오늘 지나온 pipeline</span><span>단계를 눌러 다시 보기</span></div>
    <div class="recap">${STEPS.slice(0,10).map((s,i)=>`<span role="button" tabindex="0" data-go="${i}" style="cursor:pointer">${s.k}</span>${i<9?'<em>→</em>':''}`).join('')}</div></div>
   <div class="ref">원 논문: Wilk AJ, Rustagi A, …, Blish CA. <i>A single-cell atlas of the peripheral immune response in patients with severe COVID-19.</i> Nature Medicine 26, 1070–1076 (2020). <a href="https://doi.org/10.1038/s41591-020-0944-y" target="_blank" rel="noopener">doi.org/10.1038/s41591-020-0944-y</a></div>
   <div class="note">이 시뮬레이션의 숫자·세포 수·유전자 값은 학습용으로 단순화한 가상 데이터입니다. 실제 논문 수치와 다릅니다.</div>`;
  el.querySelectorAll('[data-go]').forEach(s=>{s.onclick=()=>go(+s.dataset.go);s.onkeydown=e=>{if(e.key==='Enter')go(+s.dataset.go)}});
  S.done.add(10);
 },
 draw(){}});

/* ---------- shell ---------- */
const rail=document.getElementById('rail');
rail.innerHTML=STEPS.map((s,i)=>`<li><button data-i="${i}"><span class="dot">${i}</span><span class="nm">${s.ko}<small>${s.k}</small></span></button></li>`).join('');
rail.querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.i));
function markRail(){rail.querySelectorAll('li').forEach((li,i)=>{li.classList.toggle('cur',i===S.step);li.classList.toggle('done',S.done.has(i)&&i!==S.step);li.querySelector('.dot').textContent=S.done.has(i)&&i!==S.step?'✓':i});
  const nx=document.getElementById('next');nx.classList.toggle('pulse',S.done.has(S.step)&&S.step<10)}
function renderCode(){
  const c=document.getElementById('codeline'); if(!c) return; const f=CODE[S.step]; if(!f){c.hidden=true;return}
  const [r,py]=f(); c.querySelector('code').textContent=S.lang==='seurat'?r:py; c.querySelector('.who').textContent=S.lang==='seurat'?'R · Seurat':'Python · Scanpy';
}
function go(i){
  if(anim) cancelAnimationFrame(anim);
  S.step=clamp(i,0,STEPS.length-1); const st=STEPS[S.step];
  if(S.step>=7&&S.res==null) S.res=0.5;
  if(S.step>=6&&!S.umapRun) S.umapRun=S.step>5;
  document.getElementById('stage').innerHTML=`
   <div class="head"><div><div class="eyebrow">Step ${S.step} / ${STEPS.length-1}</div><h1>${st.title}<span>${st.ko}</span></h1></div></div>
   <div class="panel"><div class="code" id="codeline"><span class="who"></span><code></code><button id="cp">copy</button></div><div id="body" style="display:flex;flex-direction:column;gap:16px"></div></div>`;
  st.build(document.getElementById('body')); st.draw(); renderCode(); markRail();
  document.getElementById('cp').onclick=e=>{const t=document.querySelector('#codeline code').textContent;const b=e.target;
    (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{b.textContent='copied'},()=>{const r=document.createRange();r.selectNodeContents(document.querySelector('#codeline code'));getSelection().removeAllRanges();getSelection().addRange(r);b.textContent='selected'}).finally(()=>setTimeout(()=>b.textContent='copy',1200))};
  document.getElementById('prev').disabled=S.step===0;
  const nx=document.getElementById('next'); nx.textContent=S.step===STEPS.length-1?'처음으로 ↺':'다음 →';
  if(S.step===5&&S.umapRun===false){}
  hideTip(); pop.hidden=true;
}
document.getElementById('prev').onclick=()=>{go(S.step-1);scrollTo({top:0})};
document.getElementById('next').onclick=()=>{go(S.step===STEPS.length-1?0:S.step+1);document.querySelector('main').scrollIntoView({block:'start'})};
const langBtns=document.querySelectorAll('#langSeg button');
const setLang=l=>{S.lang=l;langBtns.forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===l));try{localStorage.setItem('sclab-lang',l)}catch(e){}renderCode()};
langBtns.forEach(b=>b.onclick=()=>setLang(b.dataset.l));
const redraw=()=>{refreshColors();if(anim)return;STEPS[S.step].draw()};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',redraw);
new MutationObserver(redraw).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(redraw,120)});
refreshColors(); setLang(S.lang); go(0);
document.fonts&&document.fonts.ready.then(redraw);
</script>
